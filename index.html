  <title>Biglietto d'auguri - GAME · il gioco di Natale da mandare agli amici</title>

       in .env (VITE_SITE_URL, con la barra finale): serve assoluto per og:url e og:image. -->

  <meta name="keywords" content="biglietto d'auguri, Natale, gioco, fionda, regali, auguri di Buone Feste, gioco nel browser" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["VideoGame", "WebApplication"],
    "name": "Biglietto d'auguri - GAME",
    "description": "Un biglietto d'auguri da giocare: con la fionda lanci i regali dentro le case del villaggio, tra fortini di neve, cristalli di ghiaccio e renne curiose. Tre livelli, gratis, nel browser del telefono o del computer.",
    "url": "%VITE_SITE_URL%",
    "image": "%VITE_SITE_URL%og.png",
    "inLanguage": "it",
    "genre": ["Rompicapo", "Fisica", "Natale"],
    "gamePlatform": ["Browser web", "Android", "iOS"],
    "applicationCategory": "GameApplication",
    "operatingSystem": "Qualsiasi (browser moderno)",
    "playMode": "SinglePlayer",
    "numberOfPlayers": { "@type": "QuantitativeValue", "value": 1 },
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
  }
  </script>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="frame">
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="controls">
      <button data-action="wake" data-debug title="Tasto W">Sveglia pile</button>
      <button data-action="stress" data-debug title="Tasto S">Stress +40</button>
      <button data-action="levels" class="icona" data-etichetta="Livelli" title="Livelli (tasto L)" aria-label="Livelli"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="currentColor"/><rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="currentColor"/><rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="currentColor"/><rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="currentColor"/></svg></button>
      <button data-action="reset" class="icona" data-etichetta="Ricomincia" title="Ricomincia il livello (tasto R)" aria-label="Ricomincia il livello"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4.5v4.6h4.6"/></svg></button>
      <button id="muto-btn" class="icona" data-etichetta="Audio" title="Audio (tasto M)" aria-label="Audio" aria-controls="audio-pannello" aria-expanded="false"></button>
      <button id="share-btn" class="icona" data-etichetta="Condividi" title="Condividi con gli amici" aria-label="Condividi"></button>
      <button id="installa-btn" class="icona" data-etichetta="Installa" title="Installa il gioco" aria-label="Installa il gioco" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10.5"/><path d="M7.5 10.5l4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg></button>
      <button id="fs-btn" data-etichetta="Schermo" title="Schermo intero" aria-label="Schermo intero">⛶</button>
      <button id="menu-btn" class="icona" title="Pulsanti" aria-label="Mostra o nascondi i pulsanti" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button>
    </div>
    <div id="audio-pannello" hidden>
      <div class="riga" data-canale="musica">
        <button class="interruttore" data-nome="Musica" aria-label="Musica accesa o spenta"></button>
        <input type="range" min="0" max="100" step="1" aria-label="Volume della musica" />
      </div>
      <div class="riga" data-canale="effetti">
        <button class="interruttore" data-nome="Effetti" aria-label="Effetti accesi o spenti"></button>
        <input type="range" min="0" max="100" step="1" aria-label="Volume degli effetti" />
      </div>
    </div>
    <div id="avviso" role="status" hidden></div>
    <div id="levels" hidden>
      <div class="levels-panel" role="dialog" aria-labelledby="levels-titolo">
        <button class="levels-close" data-action="close-levels" aria-label="Chiudi">✕</button>
        <h2 id="levels-titolo">Scegli il livello</h2>
        <p class="levels-stelle"></p>
        <div id="level-list"></div>
      </div>
    </div>
  </div>
  <div id="ios-hint" hidden>
    Per giocare a schermo intero: tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>. <span>✕</span>
  </div>
  <div id="rotate">Ruota il telefono in orizzontale</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
