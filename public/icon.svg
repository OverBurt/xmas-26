  </g>
  <rect width="512" height="512" fill="url(#alone)"/>
  <circle cx="256" cy="232" r="150" fill="#ffe7ad"/>
  <g fill="#d6a05a" fill-opacity="0.28">
    <circle cx="204" cy="196" r="32"/><circle cx="304" cy="262" r="42"/><circle cx="232" cy="296" r="18"/><circle cx="320" cy="170" r="18"/>
  </g>
  <!-- pino: tre piani, la punta sotto le zampe del gufo -->
