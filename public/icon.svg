      <path d="M-4 -30 Q-9 -31 -11.5 -35.5 Q-12 -29 -10 -25Z"/>
      <ellipse cx="0" cy="-11" rx="10" ry="11.5"/>
      <ellipse cx="0" cy="-24" rx="11.5" ry="9"/>
      <ellipse cx="9.6" cy="-11.5" rx="3.6" ry="7.5" transform="rotate(16 9.6 -11.5)"/>
      <ellipse cx="-9.6" cy="-11.5" rx="3.6" ry="7.5" transform="rotate(-16 -9.6 -11.5)"/>
      <ellipse cx="2.4" cy="0.2" rx="0.9" ry="1.3"/><ellipse cx="3.6" cy="0.2" rx="0.9" ry="1.3"/><ellipse cx="4.8" cy="0.2" rx="0.9" ry="1.3"/>
      <ellipse cx="-2.4" cy="0.2" rx="0.9" ry="1.3"/><ellipse cx="-3.6" cy="0.2" rx="0.9" ry="1.3"/><ellipse cx="-4.8" cy="0.2" rx="0.9" ry="1.3"/>
    </g>
    <ellipse cx="5" cy="-24" rx="4.9" ry="5.1" fill="#ffe7ad"/>
