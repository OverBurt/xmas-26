<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona dell'app: il gufo sulla punta del pino, in sagoma contro la luna, come nell'inquadratura di mira
       del gioco (stesse forme e colori di src/render/backdrop.js). Fondo pieno fino ai bordi (icona "maskable"). -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04071a"/>
      <stop offset="0.45" stop-color="#0d143d"/>
      <stop offset="0.8" stop-color="#212765"/>
      <stop offset="1" stop-color="#3e3a82"/>
    </linearGradient>
    <radialGradient id="alone" cx="256" cy="232" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#ffd68c" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffd68c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b26"/>
      <stop offset="1" stop-color="#12173f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cielo)"/>
  <g fill="#dfe6ff">
    <circle cx="62" cy="70" r="3"/><circle cx="118" cy="150" r="2"/><circle cx="446" cy="58" r="3"/><circle cx="470" cy="170" r="2"/>
